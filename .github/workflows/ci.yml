name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    # The API has outstanding type debt (~298 tsc errors, mostly noImplicitAny
    # on untyped Elysia/Drizzle generics) and a broken whitelabel module.
    # Reported, but not blocking, until that debt is paid down.
    # Tracked in Linear; see the "known debt" note in apps/api/README.md.
    name: API (typecheck - known debt, non-blocking)
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bunx tsc --noEmit

  web:
    name: Web (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun run test:run

      - name: Build
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
